<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif">
  <rect width="940" height="760" fill="#fbfaf7"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f2933">러비더비 하네스 파이프라인 🎓</text>
  <text x="40" y="80" font-size="15" fill="#7b8794">메시지 한 통 = 7단계. LLM 호출(④)은 그중 하나일 뿐, 나머지가 전부 하네스다.</text>

  <!-- input -->
  <rect x="370" y="100" width="200" height="44" rx="22" fill="#ff625d"/>
  <text x="470" y="128" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">유저 입력</text>
  <path d="M470 144 L470 170" stroke="#cbd2d9" stroke-width="2" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#cbd2d9"/>
    </marker>
  </defs>

  <!-- harness container -->
  <rect x="40" y="172" width="860" height="500" rx="16" fill="#fff" stroke="#e4e7eb" stroke-width="1.5"/>
  <text x="64" y="200" font-size="13" font-weight="700" fill="#9aa5b1" letter-spacing="1">HARNESS · engine.ts</text>

  <!-- helper for stage rows -->
  <!-- Stage 1 -->
  <g>
    <rect x="64" y="214" width="812" height="56" rx="10" fill="#eef2ff" stroke="#c3dafe"/>
    <circle cx="96" cy="242" r="16" fill="#5850ec"/><text x="96" y="247" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="126" y="238" font-size="16" font-weight="600" fill="#1f2933">잼 가드 · 상태 로드</text>
    <text x="126" y="258" font-size="13" fill="#616e7c">Stateless — 기억은 모델이 아니라 하네스(SessionState)가 보관</text>
    <text x="860" y="247" font-size="12" fill="#9aa5b1" text-anchor="end">types.ts</text>
  </g>
  <!-- Stage 2 -->
  <g>
    <rect x="64" y="278" width="812" height="56" rx="10" fill="#e6fffa" stroke="#81e6d9"/>
    <circle cx="96" cy="306" r="16" fill="#0f9b8e"/><text x="96" y="311" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="126" y="302" font-size="16" font-weight="600" fill="#1f2933">시스템 프롬프트 조립 ★ 하네스의 심장</text>
    <text x="126" y="322" font-size="13" fill="#616e7c">페르소나 + 호감도 + 모드 + 메모리북 → 하나의 system 프롬프트</text>
    <text x="860" y="311" font-size="12" fill="#9aa5b1" text-anchor="end">persona.ts</text>
  </g>
  <!-- Stage 3 -->
  <g>
    <rect x="64" y="342" width="812" height="56" rx="10" fill="#eef2ff" stroke="#c3dafe"/>
    <circle cx="96" cy="370" r="16" fill="#5850ec"/><text x="96" y="375" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="126" y="366" font-size="16" font-weight="600" fill="#1f2933">컨텍스트 구성</text>
    <text x="126" y="386" font-size="13" fill="#616e7c">최근 N턴 + 이번 발화 → messages (무엇을 얼마나 넣을지 = 비용/품질)</text>
    <text x="860" y="375" font-size="12" fill="#9aa5b1" text-anchor="end">engine.ts</text>
  </g>
  <!-- Stage 4 -->
  <g>
    <rect x="64" y="406" width="812" height="56" rx="10" fill="#fff5f5" stroke="#feb2b2"/>
    <circle cx="96" cy="434" r="16" fill="#ff625d"/><text x="96" y="439" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="126" y="430" font-size="16" font-weight="600" fill="#1f2933">메인 모델 호출 (스트리밍) — 캐릭터 응답</text>
    <text x="126" y="450" font-size="13" fill="#616e7c">claude-opus-4-8 · 품질이 중요한 응답은 최상위 모델 · 스트리밍=타임아웃 방어</text>
    <text x="860" y="439" font-size="12" fill="#9aa5b1" text-anchor="end">client.ts</text>
  </g>
  <!-- Stage 5 -->
  <g>
    <rect x="64" y="470" width="812" height="56" rx="10" fill="#fffaf0" stroke="#fbd38d"/>
    <circle cx="96" cy="498" r="16" fill="#dd9b1b"/><text x="96" y="503" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="126" y="494" font-size="16" font-weight="600" fill="#1f2933">호감도 채점 (Judge 패턴)</text>
    <text x="126" y="514" font-size="13" fill="#616e7c">claude-haiku-4-5 · 보조 작업은 싸고 빠른 모델로 (비용 최적화)</text>
    <text x="860" y="503" font-size="12" fill="#9aa5b1" text-anchor="end">affinity.ts</text>
  </g>
  <!-- Stage 6 -->
  <g>
    <rect x="64" y="534" width="812" height="56" rx="10" fill="#faf5ff" stroke="#d6bcfa"/>
    <circle cx="96" cy="562" r="16" fill="#9061f9"/><text x="96" y="567" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="126" y="558" font-size="16" font-weight="600" fill="#1f2933">메모리 압축 (Compaction)</text>
    <text x="126" y="578" font-size="13" fill="#616e7c">오래된 대화 → 메모리북 요약 (장기기억 + 컨텍스트 비용 통제)</text>
    <text x="860" y="567" font-size="12" fill="#9aa5b1" text-anchor="end">memory.ts</text>
  </g>
  <!-- Stage 7 -->
  <g>
    <rect x="64" y="598" width="812" height="56" rx="10" fill="#eef2ff" stroke="#c3dafe"/>
    <circle cx="96" cy="626" r="16" fill="#5850ec"/><text x="96" y="631" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">7</text>
    <text x="126" y="622" font-size="16" font-weight="600" fill="#1f2933">상태 갱신 → 다음 턴으로</text>
    <text x="126" y="642" font-size="13" fill="#616e7c">새 SessionState 반환 (실서비스: Supabase 등 DB에 저장) → 루프</text>
    <text x="860" y="631" font-size="12" fill="#9aa5b1" text-anchor="end">engine.ts</text>
  </g>

  <!-- output -->
  <path d="M470 672 L470 698" stroke="#cbd2d9" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="700" width="340" height="44" rx="22" fill="#1f2933"/>
  <text x="470" y="728" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">캐릭터 응답 + 호감도 변화 + 레벨업</text>
</svg>
